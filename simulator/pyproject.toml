[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algaops-sim"
version = "2.0.0"
description = "AlgaOps deterministic sensor-node simulator (DEMO / SYNTHETIC data only)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["paho-mqtt>=2.1,<3", "PyYAML>=6"]

[project.scripts]
algaops-sim = "algaops_sim.cli:main"

[tool.setuptools.packages.find]
include = ["algaops_sim*"]
