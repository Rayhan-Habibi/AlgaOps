[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algaops-gateway"
version = "2.0.0"
description = "AlgaOps Assurance edge gateway: read-only MQTT ingest, C11 trust-gated core, SQLite, Ascon audit, local API"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "paho-mqtt>=2.1,<3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.20", "amqtt>=0.11", "PyYAML>=6"]

[project.scripts]
algaops-gateway = "algaops_gateway.cli:main"

[tool.setuptools.packages.find]
include = ["algaops_gateway*"]

[tool.setuptools.package-data]
"algaops_gateway.storage.migrations" = ["*.sql"]
