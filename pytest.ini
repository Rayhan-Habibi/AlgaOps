[pytest]
pythonpath = gateway gateway/tests simulator tools
testpaths = gateway/tests simulator/tests tools/tests tests/e2e
addopts = -q -p no:cacheprovider
markers =
    e2e: end-to-end tests that start a broker, the gateway and the simulator
    slow: long-running tests (8 h replay evaluation)
filterwarnings =
    ignore::DeprecationWarning:amqtt.*
