# Mosquitto 2.x settings for the AlgaOps gateway.
# Install as /etc/mosquitto/conf.d/algaops.conf (deploy/raspberry-pi/install.sh).
# The Debian / Raspberry Pi OS package already enables persistence and file
# logging in /etc/mosquitto/mosquitto.conf; they are not repeated here.
#
# Sensor nodes on the plant LAN publish, the gateway subscribes, nobody is
# anonymous.  Never forward this port from the internet.

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/algaops/passwd
acl_file /etc/mosquitto/algaops/acl.conf

# Plain MQTT on the local network.  To restrict it to one interface use
# "listener 1883 <LAN address>" plus "listener 1883 127.0.0.1" for the gateway.
listener 1883

# TLS for a shared or untrusted node network (nodes then use mqtts://):
# listener 8883
# cafile   /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile  /etc/mosquitto/certs/server.key

# Telemetry queued for the gateway's persistent session while it is down
# (QoS 1).  20000 messages are ~7 h of one node at 1.28 s windows.
max_queued_messages 20000
max_inflight_messages 20
max_packet_size 16384
max_keepalive 120
connection_messages true
