# Mosquitto topic ACL — /etc/mosquitto/algaops/acl.conf
#
# The gateway reads every node topic and publishes nothing (read-only system).
user algaops-gateway
topic read algaops/v1/#

# Each sensor node logs in with its node id as the user name (firmware:
# CONFIG_ALGAOPS_MQTT_USERNAME = node id) and may publish only its own
# telemetry and its retained status / last will.  Nothing can subscribe to
# commands: there are none.
pattern write algaops/v1/nodes/%u/telemetry
pattern write algaops/v1/nodes/%u/status
