# chrony on the gateway: local time source for the sensor nodes.
# Install as /etc/chrony/conf.d/algaops.conf (Raspberry Pi OS Bookworm reads
# /etc/chrony/conf.d).  Adjust the subnet of the node network.
allow 192.168.10.0/24

# Keep serving time when the site has no internet.  Without an upstream source
# the Raspberry Pi has no battery clock: absolute time can be wrong after a
# power cut, but nodes and gateway still share one clock, which is what the
# freshness checks need.  Add an RTC (e.g. DS3231) or GPS for correct dates.
local stratum 10 orphan

# Step the clock at start-up if it is far off, then slew.
makestep 1.0 3
